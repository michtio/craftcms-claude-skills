name: skills-validation

# Runs every deterministic quality gate of the pack through one command,
# bin/check.sh, the same command maintainers run locally: SKILL.md frontmatter
# and listing cap, the version-detection golden tests, version-tag lint, Craft
# symbols and tables checked against the craftcms/cms source index
# (bin/data/craft-source-index.tsv), behaviour-case fact assertions and the
# lexical routing baseline. No model calls and no network: AI evals run only
# at release time, locally (evals/README.md).

on:
  push:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'bin/**'
      - 'hooks/**'
      - 'evals/**'
      - '.github/workflows/skills-validation.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'bin/**'
      - 'hooks/**'
      - 'evals/**'
      - '.github/workflows/skills-validation.yml'

permissions:
  contents: read

jobs:
  check:
    name: bin/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: All deterministic gates
        run: sh bin/check.sh
