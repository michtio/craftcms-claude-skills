name: skills-validation

# Validates every skills/*/SKILL.md frontmatter on each push and pull request
# that touches a skill or its tooling: strict YAML parse, known keys only, the spec's
# 1024-character description limit, and Claude Code's 1536-character listing
# cap for description + when_to_use. See bin/validate-skills.sh.

on:
  push:
    paths:
      - 'skills/**'
      - 'bin/**'
      - 'hooks/**'
      - 'evals/fixtures/**'
      - '.github/workflows/skills-validation.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'bin/**'
      - 'hooks/**'
      - 'evals/fixtures/**'
      - '.github/workflows/skills-validation.yml'

permissions:
  contents: read

jobs:
  validate-frontmatter:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate frontmatter and version-detection wiring
        run: bash bin/validate-skills.sh

  craft-version:
    name: Craft version detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Golden-output tests (sh, dash, bash --posix)
        run: sh bin/test-craft-version.sh

  version-tags:
    name: Craft version tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linter self-test (an untagged craft\filters\Cors must fail)
        run: "! python3 bin/craft_tags.py lint evals/fixtures/tags/untagged-cors.md"

      - name: Lint the pack (warn-only until the backfill lands)
        run: python3 bin/craft_tags.py lint skills --warn-only
